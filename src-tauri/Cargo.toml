[package]
name = "anki-mining"
version = "0.1.0"
description = "Japanese sentence mining overlay that creates Anki cards"
edition = "2021"

[lib]
name = "anki_mining_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
lindera = { version = "6", features = ["embed-unidic"] }
lindera-analysis = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
tungstenite = "0.30"
arboard = { version = "3", default-features = false }
regex = "1"
x11rb = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "api-31"] }
ureq = { version = "3", default-features = false, features = ["json"] }
unicode-normalization = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
