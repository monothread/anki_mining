name: Windows

# Builds the Windows installer, runs the tests of the Windows build and the self-test of the
# installed app on a real Windows machine, and starts the app to see that it opens. Run it by hand
# (Actions > Windows > Run workflow); the release workflow uses it too.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: OCR models and the ONNX Runtime library
        run: scripts/fetch-ocr-models.sh windows

      - name: Dictionary
        run: scripts/build-dictionary.sh

      - name: Speech (needs the repository variable VOICEVOX_TERMS_ACCEPTED=1)
        if: vars.VOICEVOX_TERMS_ACCEPTED == '1'
        env:
          VOICEVOX_TERMS_ACCEPTED: "1"
          MINGW_GCC: gcc
        run: scripts/fetch-tts.sh windows

      - name: Frontend dependencies
        run: npm ci

      - name: Type check, lint and frontend tests
        run: |
          npx tsc --noEmit --project tsconfig.json
          npx eslint src test --max-warnings=0
          npx vitest run

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Installer
        if: ${{ !cancelled() }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build --bundles nsis
          fi
          ls -la src-tauri/target/release/bundle/nsis

      - name: Install the app
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/D=C:\AnkiMining' -Wait
          Get-ChildItem C:\AnkiMining -Recurse -Depth 1 | Select-Object -First 60 FullName, Length

      - name: Self-test of the installed app
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $run = Start-Process -FilePath C:\AnkiMining\anki-mining.exe -ArgumentList '--self-test', 'C:\AnkiMining', "$PWD\self-test.txt" -Wait -PassThru
          Get-Content self-test.txt
          if ($run.ExitCode -ne 0) { throw "the self-test failed (exit code $($run.ExitCode))" }

      - name: The app opens
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $app = Start-Process -FilePath C:\AnkiMining\anki-mining.exe -PassThru
          Start-Sleep -Seconds 25
          $app.Refresh()
          if ($app.HasExited) { throw "the app closed on its own (exit code $($app.ExitCode))" }
          Write-Host "The app is running: window '$($app.MainWindowTitle)'"
          Stop-Process -Id $app.Id -Force

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-self-test
          if-no-files-found: ignore
          path: self-test.txt
