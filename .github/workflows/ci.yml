name: CI

# Pull requests and by hand only: everyday work is checked on the developer's machine with
# scripts/dev.sh and scripts/win.sh, so a push does not start a run.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the dev image
        run: scripts/dev.sh image
      - name: Install the frontend dependencies
        run: scripts/dev.sh install
      - name: Download the OCR models and the ONNX Runtime library
        run: scripts/dev.sh exec scripts/fetch-ocr-models.sh
      - name: Fetch the speech (needs the repository variable VOICEVOX_TERMS_ACCEPTED=1)
        if: vars.VOICEVOX_TERMS_ACCEPTED == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/dev.sh exec env VOICEVOX_TERMS_ACCEPTED=1 GITHUB_TOKEN scripts/fetch-tts.sh
      - name: Build the bundled dictionary
        run: scripts/dev.sh exec scripts/build-dictionary.sh
      - name: Type check
        run: scripts/dev.sh typecheck
      - name: Lint
        run: scripts/dev.sh lint
      - name: Test
        run: scripts/dev.sh test
