name: Release

# Builds the Linux AppImage and the Windows installer, signs them for the updater and publishes a
# GitHub release with a `latest.json` that tells the installed apps about the new version. Run it by
# hand (Actions > Release > Run workflow) with the version of tauri.conf.json, e.g. 0.2.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (without the v), the one in src-tauri/tauri.conf.json
        required: true
      notes:
        description: Release notes
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/dev.sh image
      - run: scripts/dev.sh install
      - run: scripts/dev.sh exec scripts/fetch-ocr-models.sh
      - name: Speech (needs the repository variable VOICEVOX_TERMS_ACCEPTED=1)
        if: vars.VOICEVOX_TERMS_ACCEPTED == '1'
        run: scripts/dev.sh exec env VOICEVOX_TERMS_ACCEPTED=1 scripts/fetch-tts.sh
      - run: scripts/dev.sh test
      - name: AppImage (also builds the dictionary)
        run: scripts/dev.sh appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.AppImage.sig

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Release files and latest.json
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          linux="$(ls assets/linux-appimage/*.AppImage)"
          windows="$(ls assets/windows-installer/*-setup.exe)"
          printf '%s\n' "${NOTES:-Version ${VERSION}}" > notes.md
          python3 scripts/latest_json.py "${VERSION}" "${GITHUB_REPOSITORY}" notes.md "${linux}" "${windows}" > latest.json
          cat latest.json
          gh release create "v${VERSION}" "${linux}" "${linux}.sig" "${windows}" "${windows}.sig" latest.json \
            --title "AnkiMining ${VERSION}" --notes-file notes.md
